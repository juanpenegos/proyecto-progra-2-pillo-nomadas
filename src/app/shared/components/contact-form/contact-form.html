<form class="contacto" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
  <h3 class="contacto__titulo">Tus datos de contacto</h3>

  <div class="contacto__campo">
    <label class="contacto__etiqueta" for="contacto-nombre">Nombre completo</label>
    <input
      class="contacto__entrada"
      id="contacto-nombre"
      type="text"
      autocomplete="name"
      placeholder="Tu nombre completo"
      formControlName="nombre"
      [attr.aria-invalid]="invalido('nombre')"
      aria-describedby="contacto-nombre-error"
    />
    <p class="contacto__error" id="contacto-nombre-error" role="alert">
      @if (invalido('nombre')) {
        Ingresa tu nombre completo
      }
    </p>
  </div>

  <div class="contacto__campo">
    <label class="contacto__etiqueta" for="contacto-correo">Correo electrónico</label>
    <input
      class="contacto__entrada"
      id="contacto-correo"
      type="email"
      autocomplete="email"
      placeholder="tu@correo.com"
      formControlName="correo"
      [attr.aria-invalid]="invalido('correo')"
      aria-describedby="contacto-correo-error"
    />
    <p class="contacto__error" id="contacto-correo-error" role="alert">
      @if (invalido('correo')) {
        Ingresa un correo electrónico válido
      }
    </p>
  </div>

  <button type="submit" class="boton boton--cta contacto__confirmar">Confirmar reserva</button>
  <button type="button" class="contacto__cancelar" (click)="cancelar.emit()">Cancelar</button>
</form>
