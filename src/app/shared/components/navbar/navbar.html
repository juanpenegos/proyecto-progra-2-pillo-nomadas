<header class="navbar">
  <div class="navbar__barra contenedor">
    <a class="navbar__marca" routerLink="/" aria-label="Pillo Nómadas, ir al inicio">
      <img class="navbar__logo" src="assets/logos/logo-verde.png" alt="" width="29" height="36" />
      <span class="navbar__nombre">Pillo Nómadas</span>
    </a>

    <nav class="navbar__enlaces" aria-label="Principal">
      <ul class="navbar__lista">
        @for (enlace of enlaces; track enlace.ruta) {
          <li>
            <a
              class="navbar__enlace"
              [routerLink]="enlace.ruta"
              routerLinkActive="navbar__enlace--activo"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: enlace.exacto }"
              >{{ enlace.texto }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <div class="navbar__acciones">
      <a class="boton boton--cta navbar__buscar" routerLink="/explorar">
        <svg class="navbar__icono" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        Buscar
      </a>
      <button
        #hamburguesa
        type="button"
        class="navbar__hamburguesa"
        aria-label="Abrir menú"
        aria-controls="menu-movil"
        [attr.aria-expanded]="menuAbierto()"
        (click)="abrirMenu()"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>
</header>

@if (menuAbierto()) {
  <app-mobile-menu [enlaces]="enlaces" (cerrar)="cerrarMenu()" />
}
