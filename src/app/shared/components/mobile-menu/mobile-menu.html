<div class="menu-movil__velo" (click)="cerrar.emit()" aria-hidden="true"></div>
<aside class="menu-movil" id="menu-movil" aria-label="Menú de navegación">
  <div class="menu-movil__cabecera">
    <span class="menu-movil__marca">
      <img src="assets/logos/logo-verde.png" alt="" width="29" height="36" />
      <span class="menu-movil__nombre">Pillo Nómadas</span>
    </span>
    <button #botonCerrar type="button" class="menu-movil__cerrar" aria-label="Cerrar menú" (click)="cerrar.emit()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav aria-label="Menú móvil">
    <p class="menu-movil__titulo">Menú</p>
    <ul class="menu-movil__lista">
      @for (enlace of enlaces; track enlace.ruta) {
        <li>
          <a
            class="menu-movil__opcion"
            [routerLink]="enlace.ruta"
            routerLinkActive="menu-movil__opcion--activa"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: enlace.exacto }"
            (click)="cerrar.emit()"
          >
            <span class="menu-movil__icono">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                @switch (enlace.icono) {
                  @case ('inicio') {
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <path d="M9 22V12h6v10" />
                  }
                  @case ('explorar') {
                    <circle cx="12" cy="12" r="10" />
                    <path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z" />
                  }
                  @case ('reservas') {
                    <path d="M8 2v4M16 2v4" />
                    <rect width="18" height="18" x="3" y="4" rx="2" />
                    <path d="M3 10h18" />
                    <path d="m9 16 2 2 4-4" />
                  }
                }
              </svg>
            </span>
            <span class="menu-movil__texto">{{ enlace.texto }}</span>
            <svg class="menu-movil__flecha" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="menu-movil__ayuda">
    <p>¿Necesitas ayuda con tu reserva?</p>
    <p class="menu-movil__soporte">Hablar con soporte →</p>
  </div>
</aside>
